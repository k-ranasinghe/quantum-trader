groups:
  - name: model_performance
    rules:
      - alert: ModelDriftDetected
        expr: model_drift_psi > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Data drift detected for {{ $labels.asset }}"
          description: "PSI score is {{ $value }}, exceeding threshold of 0.2"

      - alert: LowModelConfidence
        expr: avg_signal_confidence < 0.65
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Low model confidence detected"
          description: "Average confidence is {{ $value }}, below threshold"

      - alert: HighModelLatency
        expr: model_inference_duration_seconds > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High model inference latency"
          description: "Inference taking {{ $value }}s, exceeding 1s threshold"

  - name: system_health
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} requests/sec"

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service has been down for 2 minutes"