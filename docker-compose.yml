services:
# ===================================
# FastAPI Application
# ===================================
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/quantum_trader
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./results:/app/results # Shared volume for artifacts
    depends_on:
      - db
      - redis
      - rabbitmq
      - mlflow

# ===================================
# Celery Worker
# ===================================
  worker:
    build: .
    command: celery -A config.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/quantum_trader
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./results:/app/results # Shared volume for artifacts
    depends_on:
      - db
      - redis
      - rabbitmq
      - mlflow

# ===================================
# Celery Beat (Scheduler)
# ===================================
  beat:
    build: .
    command: celery -A config.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/quantum_trader
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq

# ===================================
# PostgreSQL
# ===================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=quantum_trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d quantum_trader" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ===================================
# Redis
# ===================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# ===================================
# RabbitMQ
# ===================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

# ===================================
# MLflow Tracking Server
# ===================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts --allowed-hosts "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow-artifacts

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
